includeconf=/var/lib/justverify/config/managed.conf
# JustVerify default: private-key-free, local RPC; data mount required by systemd.
server=1
disablewallet=1
prune=0
listen=1
listenonion=0
onion=127.0.0.1:9050
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
natpmp=0

[main]
bind=0.0.0.0:8333
bind=[::]:8333
bind=127.0.0.1:8334=onion
whitebind=download,noban@127.0.0.1:8335
