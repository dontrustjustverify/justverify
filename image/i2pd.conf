# JustVerify Bitcoin P2P router. Public I2P tunnels are distinct from LAN RPC.
daemon = false
log = stdout
loglevel = warn
ipv4 = true
ipv6 = false
bandwidth = O
share = 50
floodfill = false
certsdir = /opt/justverify/i2pd/certificates

[http]
enabled = false
[httpproxy]
enabled = false
[socksproxy]
enabled = false
[sam]
enabled = true
address = 127.0.0.1
port = 7656
[bob]
enabled = false
[i2cp]
enabled = false
[i2pcontrol]
enabled = false
[upnp]
enabled = false
[limits]
transittunnels = 20
